[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-evolve"
version = "0.2.0"
description = "Evolve an agent's harness (prompts, tool descriptions, settings) from its own failure traces, accepting only changes that beat measured run-to-run noise."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Siddharth Sukumar" }]
keywords = ["llm", "agents", "evals", "harness-engineering", "prompt-optimization"]
dependencies = []

[project.scripts]
harness-evolve = "harness_evolve.cli:main"

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = ["pytest>=8", "litellm>=1.40", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes (real bugs), import order, pyupgrade, bugbear (common bug patterns)
select = ["E", "F", "W", "I", "UP", "B"]
